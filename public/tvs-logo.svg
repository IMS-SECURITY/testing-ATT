<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" role="img" aria-labelledby="tvs-title tvs-desc">
  <title id="tvs-title">TVS Electronics</title>
  <desc id="tvs-desc">Official Logo of TVS Electronics</desc>
  <defs>
    <style>
      .logo-ellipse {
        fill: none;
        stroke: #00b0f0;
        stroke-width: 14;
      }
      .logo-tvs {
        font-family: "Impact", "Arial Black", -apple-system, sans-serif;
        font-weight: 900;
        fill: #00b0f0;
        text-anchor: middle;
      }
      .logo-electronics {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        fill: #00b0f0;
        text-anchor: middle;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>
  <!-- Main Oval -->
  <ellipse cx="250" cy="120" rx="220" ry="100" class="logo-ellipse" />
  
  <!-- Slanted text to match the italicized TVSE brand font slant -->
  <g transform="translate(250, 120) skewX(-14) translate(-250, -120)">
    <!-- TVS text -->
    <text x="250" y="118" font-size="115" class="logo-tvs">TVS</text>
    <!-- ELECTRONICS text -->
    <text x="253" y="165" font-size="26" class="logo-electronics">ELECTRONICS</text>
  </g>
</svg>
